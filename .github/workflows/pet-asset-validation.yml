name: Pet asset source and Blender build

on:
  push:
    paths:
      - "assets/pets/bunny/**"
      - ".github/workflows/pet-asset-validation.yml"
  pull_request:
    paths:
      - "assets/pets/bunny/**"
      - ".github/workflows/pet-asset-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bunny-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate OBJ and MTL
        run: python assets/pets/bunny/validate_bunny_source.py
      - name: Check Blender script syntax
        run: python -m py_compile assets/pets/bunny/build_bunny_rig.py assets/pets/bunny/validate_bunny_blender_output.py

  build-bunny-blender:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Blender 4.2.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
      - name: Report Blender version
        run: |
          blender --version
          blender --background --python-expr "import bpy; assert bpy.app.version >= (4, 2, 0), bpy.app.version_string"
      - name: Build rigged Bunny project and FBX
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python assets/pets/bunny/build_bunny_rig.py
          test -s assets/pets/bunny/bunny_rigged.blend
          test -s assets/pets/bunny/bunny_rigged.fbx
      - name: Validate generated Blender and FBX files
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python assets/pets/bunny/validate_bunny_blender_output.py
          test -s assets/pets/bunny/bunny_rigged.blend
          test -s assets/pets/bunny/bunny_rigged.fbx
      - name: Upload rigged Bunny outputs
        uses: actions/upload-artifact@v4
        with:
          name: pet-kingdoms-bunny-rigged
          path: |
            assets/pets/bunny/bunny_rigged.blend
            assets/pets/bunny/bunny_rigged.fbx
          if-no-files-found: error
          retention-days: 30
